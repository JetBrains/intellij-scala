# Pull-request CI for changes targeting supported release branches.
# It builds the Community plugin and runs the JUnit 5, typechecker, and fast-test tiers.
# It intentionally does not run the full suite or trigger on direct pushes.
name: Pull Request Build & Test

on:
  pull_request:
    branches: [ idea262.x, idea263.x ]

jobs:
  build_and_test:
    name: Scala Plugin Build & Test
    runs-on: ubuntu-latest
    env:
      JAVA_OPTS: -Xmx8192m -XX:ReservedCodeCacheSize=512m
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # setup-java makes the final entry JAVA_HOME. Keep it in sync with
          # the required build JDK in README.md and project/JdkVersionCheck.scala.
          # Earlier JDKs remain available for tests that launch external JVMs.
          java-version: |
            8
            11
            17
            21
            25
      - name: Verify JDK 25 build runtime
        run: |
          java -version
          java_version="$(java -XshowSettings:properties -version 2>&1 | awk '/java.specification.version =/ { print $3 }')"
          test "$java_version" = "25"
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v6
      - name: Compile and package
        run: sbt clean packageArtifact Test/compile
      - name: Run internationalization bundle tests
        run: sbt runJUnit5Tests
      - name: Run typechecker tests
        run: sbt runTypeInferenceTests
      - name: Run assorted tests
        run: sbt runFastTests
